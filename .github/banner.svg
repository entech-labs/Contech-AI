<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Contech-AI — Autodesk Connector for Claude, by EnTech Labs">
  <title>Contech-AI — Autodesk Connector for Claude</title>

  <rect width="1200" height="300" fill="#ffffff"/>
  <rect y="296" width="1200" height="4" fill="#231f20"/>

  <!-- ENTECH wordmark, drawn in the logo's squared-terminal style -->
  <g fill="#231f20" transform="translate(64,52) scale(0.46)">
    <!-- E -->
    <path d="M0 0 h96 v22 H24 a8 8 0 0 0 -8 8 v18 h72 v22 H16 v18 a8 8 0 0 0 8 8 h72 v22 H0 Z"/>
    <!-- N -->
    <path d="M116 0 h22 l58 76 V0 h22 v118 h-22 l-58 -76 v76 h-22 Z"/>
    <!-- T -->
    <path d="M232 0 h114 v22 h-46 v96 h-22 V22 h-46 Z"/>
    <!-- E -->
    <path d="M360 0 h96 v22 h-72 a8 8 0 0 0 -8 8 v18 h72 v22 h-72 v18 a8 8 0 0 0 8 8 h72 v22 h-96 Z"/>
    <!-- C -->
    <path d="M568 0 h-72 a24 24 0 0 0 -24 24 v70 a24 24 0 0 0 24 24 h72 v-22 h-66 a8 8 0 0 1 -8 -8 V30 a8 8 0 0 1 8 -8 h66 Z"/>
